name: Level tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: 3.6.3

jobs:
  levels:
    name: Play every level
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and tools
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -yq xvfb git perl
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_x11.64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          echo "GODOT=/tmp/godot/Godot_v${GODOT_VERSION}-stable_x11.64" >> "$GITHUB_ENV"

      - name: Import resources
        # The editor sometimes keeps running after an import with --quit.
        run: timeout 300 xvfb-run -a "$GODOT" --editor --quit --no-window --path . || true

      - name: Run level harness
        run: LOG_DIR="$RUNNER_TEMP/logs" xvfb-run -a tests/run_tests.sh

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: level-test-logs
          path: ${{ runner.temp }}/logs
